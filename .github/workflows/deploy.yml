name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy notification
        run: |
          echo "Deployment triggered via n8n workflow"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Document Vercel deployment behavior
        run: |
          echo "No manual Vercel deployment is triggered in this workflow step."
          echo "Note: Vercel deployments are handled automatically (e.g., on push to the configured branch)."
